name: Publish

# Publie sur npm quand un tag vX.Y.Z est poussé. Seul ce workflow peut publier : c'est lui que
# npm reconnaît comme éditeur de confiance (Trusted Publisher), sans jeton stocké.
on:
    push:
        tags: ['v*']

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
            # La publication par éditeur de confiance (OIDC) demande npm 11.5.1 ou plus.
            - run: npm install -g npm@^11.5.1
            - run: pnpm install --frozen-lockfile
            - name: Tag matches package.json
              run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
            # Version déjà sur npm (publiée à la main, ou tag repoussé) : rien à faire, sans erreur.
            - name: Already published?
              id: published
              run: |
                  spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
                  if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then
                      echo "$spec est déjà sur npm, publication sautée."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  fi
            # prepublishOnly lance la vérification des types, les tests et le build avant l'envoi.
            - run: npm publish --provenance --access public
              if: steps.published.outputs.skip != 'true'
