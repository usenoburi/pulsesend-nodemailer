name: Tests

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:

jobs:
    test:
        name: Node ${{ matrix.node }}, Nodemailer ${{ matrix.nodemailer }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['20', '22', '24']
                nodemailer: ['6', '7', '10']
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm add -D nodemailer@${{ matrix.nodemailer }}
            - run: pnpm run typecheck
              if: matrix.nodemailer == '10'
            - run: pnpm test
            - run: pnpm run build

    publish:
        name: Publish to npm
        needs: test
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  registry-url: 'https://registry.npmjs.org'
            - run: pnpm install --frozen-lockfile
            - name: Tag matches package.json
              run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
            - run: pnpm run build
            # Trusted publishing (OIDC) : aucun jeton npm stocké, provenance attachée au paquet.
            - run: npm publish --provenance --access public
