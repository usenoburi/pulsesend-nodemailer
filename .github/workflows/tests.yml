name: Tests

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        name: Node ${{ matrix.node }}, Nodemailer ${{ matrix.nodemailer }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node: ['20', '22', '24']
                nodemailer: ['6', '7', '10']
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm add -D nodemailer@${{ matrix.nodemailer }}
            - run: pnpm run typecheck
              if: matrix.nodemailer == '10'
            - run: pnpm test
            # tsdown demande Node 22.18 ou plus ; le paquet construit, lui, tourne sous Node 20.
            - run: pnpm run build
              if: matrix.node != '20'
